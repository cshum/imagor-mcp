name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the release workflow so a tagged commit is verified by the same
  # checks the branch saw.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The server is pure Go, so unlike imagor this needs no libvips, no cgo
      # and no container to build or test.
      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      # The filter catalogue is generated from the imagor release pinned in
      # go.mod. If a dependency bump changes it, the regenerated file must be
      # committed: a stale catalogue rejects filters that exist, or accepts
      # ones imagor would ignore in silence.
      - name: Check the filter catalogue is current
        run: |
          go generate ./internal/filters
          if ! git diff --exit-code -- internal/filters/catalog_gen.go; then
            echo "::error::internal/filters/catalog_gen.go is out of date."
            echo "::error::Run 'go generate ./internal/filters' and commit the result."
            exit 1
          fi

      # docs.imagor.net carries an Imagor MCP page that is this README, section for section,
      # generated by scripts/sync-docs-page.py. Editing one and not the other is silent
      # otherwise, which is how it drifted three times in one day.
      - name: Check the docs page matches the README
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/cshum/imagor/main/docs/docs/imagor-mcp.md
          if ! curl -sfL --max-time 30 "$url" -o /tmp/imagor-mcp-page.md; then
            echo "::notice::imagor/docs does not carry the page yet, so there is nothing to compare"
            exit 0
          fi
          if ! python3 scripts/sync-docs-page.py --check /tmp/imagor-mcp-page.md; then
            echo "::error::the Imagor MCP page on docs.imagor.net is out of step with this README."
            echo "::error::In cshum/imagor run: python3 scripts/sync-docs-page.py -w docs/docs/imagor-mcp.md"
            exit 1
          fi

