name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag can point at a commit CI never saw, so the release re-runs the same
  # checks rather than assuming the branch passed them.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The server is pure Go, so every target builds from any host with no
      # libvips and no cgo.
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            # Both front ends on the one engine, so a release carries the compiler
            # whether or not the person downloading it wants an MCP client.
            for cmd in imagor-mcp imagor-template; do
              out="dist/${cmd}_${GITHUB_REF_NAME}_${os}_${arch}${ext}"
              echo "building $out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                  -o "$out" "./cmd/${cmd}"
            done
          done

      # The tag reaches the binary through ldflags alone, so prove it arrived
      # rather than trusting the flag string.
      - name: Check the built binary reports the tag
        run: |
          set -euo pipefail
          got="$(./dist/imagor-mcp_${GITHUB_REF_NAME}_linux_amd64 -version)"
          echo "binary reports: $got"
          if [ "$got" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::expected ${GITHUB_REF_NAME}, got ${got}"
            exit 1
          fi
          # the CLI reaches the tag through its own ldflags, so check it too
          got="$(./dist/imagor-template_${GITHUB_REF_NAME}_linux_amd64 version | awk '{print $2}')"
          echo "cli reports: $got"
          if [ "$got" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::cli: expected ${GITHUB_REF_NAME}, got ${got}"
            exit 1
          fi

      # An MCP bundle is what a host installs in one click, and the registry's
      # mcpb entry points at a release asset - so the bundle has to ride with the
      # release rather than being built by hand.
      - name: Set up Node
        uses: actions/setup-node@v7

      - name: Build the MCP bundle
        run: ./mcpb/build.sh "${GITHUB_REF_NAME}" dist

      # Stable names as well as versioned ones, so the README and any pinned config can use
      # releases/latest/download/<name> and never need editing again. The version stays in the
      # versioned copy for anyone who wants to pin.
      - name: Add version-free aliases
        run: |
          set -euo pipefail
          cd dist
          cp "imagor-mcp-${GITHUB_REF_NAME}.mcpb" imagor-mcp.mcpb
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            cp "imagor-mcp_${GITHUB_REF_NAME}_${os}_${arch}${ext}" "imagor-mcp_${os}_${arch}${ext}"
          done
          ls -1 | sort

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"

  # Called rather than dispatched: GITHUB_TOKEN cannot trigger a workflow run, so a release
  # that wants the registry updated has to run those steps inline. The workflow stamps the
  # version and hash from this release, so nothing has to be bumped by hand first.
  registry:
    name: Update the MCP Registry
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: ${{ github.ref_name }}

  # The server is a static binary, so the image is the binary plus certificates. It exists
  # for the one-line install: a client config can name a container where it would otherwise
  # have to name a path to a file the user has to fetch first.
  image:
    name: Publish the image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
